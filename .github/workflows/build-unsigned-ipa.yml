name: Build unsigned iPad IPA for personal sideloading

on:
  push:
    branches: [main]
    paths:
      - 'SWIFT_PACKAGE_VERSION'
  workflow_dispatch:
    inputs:
      identity:
        description: 'Preview is a separate app. Primary may replace an existing InfiniCanvas app; only after backup.'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - primary
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-unsigned-ipa.yml'
  # A new preview is made automatically from the exact main-branch commit
  # that passed the full Xcode 27 + PencilKit simulator gates.
  workflow_run:
    workflows: ["Validate Infini Canvas on Apple SDK"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: infini-unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipad:
    # Ignore PR validation runs and failed quality checks. Only a successful
    # PUSH to main can trigger an automatic ready-to-download preview.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    name: Compile device IPA without signing or Mac rental
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out source (no signing secrets)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Pin the binary to the *validated* commit, not whichever new main
          # commit happens to exist by the time the runner starts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Guard permanent app source and CI wiring
        run: python3 Scripts/preflight_contract.py

      - name: Require latest approved source before automatic version builds
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The automatic release path must never publish a random main-branch edit.
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = "SWIFT_PACKAGE_VERSION" || {
            echo "Auto IPA only runs for a version-only release commit." >&2; exit 1;
          }
          verified_source="$(git rev-parse HEAD^)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${verified_source}&per_page=100")"
          echo "$runs" | jq -e --arg sha "$verified_source" '
            [.workflow_runs[] | select(.name=="Validate Infini Canvas on Apple SDK"
            and .event=="push" and .head_sha==$sha and .status=="completed"
            and .conclusion=="success")] | length > 0' >/dev/null || {
            echo "No fully successful Apple simulator/host CI for source $verified_source" >&2;
            exit 1;
          }
          echo "Approved source: $verified_source"

      - name: Generate the native app host
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          cd IntegrationHost
          xcodegen generate

      - name: Build unsigned iPadOS app from current package source
        shell: bash
        env:
          IDENTITY_MODE: ${{ inputs.identity || 'preview' }}
        run: |
          set -euo pipefail
          case "$IDENTITY_MODE" in
            preview) BUNDLE_ID="com.perspective2001.infini-canvas.sideloadpreview" ;;
            primary) BUNDLE_ID="com.perspective2001.infini-canvas.native" ;;
            *) echo "Unknown app identity; refusing to build" >&2; exit 1 ;;
          esac
          VERSION="$(tr -d '\r\n ' < SWIFT_PACKAGE_VERSION)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Exact compiled source: $SOURCE_SHA; event=${{ github.event_name }}"
          BUILD_NUMBER="$((10000 + GITHUB_RUN_NUMBER))"
          echo "Building $VERSION ($BUILD_NUMBER), identity=$BUNDLE_ID (no user data included)"
          xcodebuild -project IntegrationHost/InfiniCanvasHost.xcodeproj \
            -scheme InfiniCanvasHost \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build-personal-ipa" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build

          APP="$GITHUB_WORKSPACE/.build-personal-ipa/Build/Products/Release-iphoneos/InfiniCanvasHost.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/InfiniCanvasHost"
          PLIST="$APP/Info.plist"
          # Explicitly stamp metadata on the *unsigned output*, not the source host.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          test "$ACTUAL_ID" = "$BUNDLE_ID" || {
            echo "Bundle ID mismatch: $ACTUAL_ID != $BUNDLE_ID" >&2; exit 1;
          }
          mkdir -p "$GITHUB_WORKSPACE/unsigned-ipa/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/unsigned-ipa/Payload/InfiniCanvasHost.app"
          (cd "$GITHUB_WORKSPACE/unsigned-ipa" && zip -qry "$GITHUB_WORKSPACE/InfiniCanvas-unsigned-$IDENTITY_MODE.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/InfiniCanvas-unsigned-$IDENTITY_MODE.ipa"
          echo "IPA_NAME=InfiniCanvas-unsigned-$IDENTITY_MODE.ipa" >> "$GITHUB_ENV"
          echo "IPA_ARTIFACT=InfiniCanvas-unsigned-$IDENTITY_MODE" >> "$GITHUB_ENV"
          echo "PASS: unsigned IPA assembled; Sideloadly must sign it on the user's Windows PC"

      - name: Record exact source and validation limits with the download
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            STATUS="APPLE_SOURCE_CI_PASSED__PHYSICAL_IPAD_UNVERIFIED"
          else
            STATUS="MANUAL_OR_VERSION_TRIGGER__APPLE_SOURCE_CI_NOT_ASSERTED__PHYSICAL_IPAD_UNVERIFIED"
          fi
          cat > InfiniCanvas-BUILD-INFO.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Source commit: ${SOURCE_SHA}
          Requested ref: ${GITHUB_REF}
          Workflow event: ${GITHUB_EVENT_NAME}
          Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          IPA artifact: ${IPA_ARTIFACT}
          Evidence: ${STATUS}
          WARNING: Compile success does NOT prove Pencil width, native glass morph, lasso behavior, or physical gesture acceptance.
          Keep existing iPad app and its data; do not uninstall to update.
          EOF
          {
            echo "### IPA provenance"
            echo "- **Source SHA:** \`${SOURCE_SHA}\`"
            echo "- **Evidence:** ${STATUS}"
            echo "- **On-device verified:** NO"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload unsigned IPA (not an installed/signed app)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IPA_ARTIFACT }}
          path: |
            ${{ env.IPA_NAME }}
            InfiniCanvas-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
