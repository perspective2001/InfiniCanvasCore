name: Build unsigned iPad IPA for personal sideloading

on:
  workflow_dispatch:
    inputs:
      identity:
        description: 'Preview is a separate app. Primary may replace an existing InfiniCanvas app; only after backup.'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - primary
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: read

concurrency:
  group: infini-unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipad:
    name: Compile device IPA without signing or Mac rental
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out source (no signing secrets)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Guard permanent app source and CI wiring
        run: python3 Scripts/preflight_contract.py

      - name: Generate the native app host
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          cd IntegrationHost
          xcodegen generate

      - name: Build unsigned iPadOS app from current package source
        shell: bash
        env:
          IDENTITY_MODE: ${{ inputs.identity || 'preview' }}
        run: |
          set -euo pipefail
          case "$IDENTITY_MODE" in
            preview) BUNDLE_ID="com.perspective2001.infini-canvas.sideloadpreview" ;;
            primary) BUNDLE_ID="com.perspective2001.infini-canvas.native" ;;
            *) echo "Unknown app identity; refusing to build" >&2; exit 1 ;;
          esac
          VERSION="$(tr -d '\r\n ' < SWIFT_PACKAGE_VERSION)"
          BUILD_NUMBER="$((10000 + GITHUB_RUN_NUMBER))"
          echo "Building $VERSION ($BUILD_NUMBER), identity=$BUNDLE_ID (no user data included)"
          xcodebuild -project IntegrationHost/InfiniCanvasHost.xcodeproj \
            -scheme InfiniCanvasHost \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build-personal-ipa" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build

          APP="$GITHUB_WORKSPACE/.build-personal-ipa/Build/Products/Release-iphoneos/InfiniCanvasHost.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/InfiniCanvasHost"
          PLIST="$APP/Info.plist"
          # Explicitly stamp metadata on the *unsigned output*, not the source host.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          test "$ACTUAL_ID" = "$BUNDLE_ID" || {
            echo "Bundle ID mismatch: $ACTUAL_ID != $BUNDLE_ID" >&2; exit 1;
          }
          mkdir -p "$GITHUB_WORKSPACE/unsigned-ipa/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/unsigned-ipa/Payload/InfiniCanvasHost.app"
          (cd "$GITHUB_WORKSPACE/unsigned-ipa" && zip -qry "$GITHUB_WORKSPACE/InfiniCanvas-unsigned-$IDENTITY_MODE.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/InfiniCanvas-unsigned-$IDENTITY_MODE.ipa"
          echo "IPA_NAME=InfiniCanvas-unsigned-$IDENTITY_MODE.ipa" >> "$GITHUB_ENV"
          echo "IPA_ARTIFACT=InfiniCanvas-unsigned-$IDENTITY_MODE" >> "$GITHUB_ENV"
          echo "PASS: unsigned IPA assembled; Sideloadly must sign it on the user's Windows PC"

      - name: Upload unsigned IPA (not an installed/signed app)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IPA_ARTIFACT }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14
