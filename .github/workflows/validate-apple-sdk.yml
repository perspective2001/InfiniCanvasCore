name: Validate Infini Canvas on Apple SDK

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm Xcode and available schemes
        run: |
          xcodebuild -version
          xcodebuild -list
      - name: Resolve public version as a fresh dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/infini-consumer/Sources/InfiniConsumer
          cat > /tmp/infini-consumer/Package.swift <<'EOF'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "InfiniConsumer",
              platforms: [.iOS("17.5")],
              dependencies: [
                  .package(url: "https://github.com/perspective2001/InfiniCanvasCore.git", from: "1.0.0")
              ],
              targets: [
                  .executableTarget(name: "InfiniConsumer", dependencies: ["InfiniCanvasCore"])
              ]
          )
          EOF
          echo 'import InfiniCanvasCore' > /tmp/infini-consumer/Sources/InfiniConsumer/main.swift
          cd /tmp/infini-consumer
          swift package resolve
          swift package show-dependencies
      - name: Validate canvas geometry at all supported zoom levels
        run: |
          set -euo pipefail
          swiftc Sources/InfiniCanvasCore/CanvasGeometry.swift Tests/GeometrySmoke/GeometrySmoke.swift -o /tmp/infini-geometry-smoke
          /tmp/infini-geometry-smoke
      - name: Compile for iPad simulator
        run: |
          set -o pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCanvasBuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/infini-build.log
      - name: Run native PencilKit regression tests
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; all=[x for a in d.values() for x in a if x.get("isAvailable",True)]; pick=next((x for x in all if "iPad" in x["name"]), next((x for x in all if "iPhone" in x["name"]), None)); print(pick["udid"] if pick else "")')"
          if [ -z "$SIMULATOR_ID" ]; then echo "No available Apple iOS simulator" >&2; exit 1; fi
          echo "Running tests on simulator $SIMULATOR_ID"
          xcodebuild -scheme InfiniCanvasCore -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath /tmp/InfiniCanvasTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee /tmp/infini-tests.log
