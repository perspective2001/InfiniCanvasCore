name: Validate Infini Canvas on Apple SDK

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'IntegrationHost/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'IntegrationHost/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-v2-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  current-playgrounds-sdk:
    # Swift Playground 4.7's published SDK is iOS 26. Test the compiler family
    # user's actual iPad editor can use, not only future Xcode 27 SDKs.
    name: Existing iPad Playground SDK and PencilKit tests
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: SDK versions
        run: xcodebuild -version
      - name: Geometric zoom/lasso invariants
        run: |
          set -euo pipefail
          swiftc Sources/InfiniCanvasCore/CanvasGeometry.swift Tests/GeometrySmoke/GeometrySmoke.swift -o /tmp/geometry-smoke
          /tmp/geometry-smoke
      - name: Compile package against iPad Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCore26 CODE_SIGNING_ALLOWED=NO build
      - name: Test actual SwiftUI root, PencilKit and persistence
        timeout-minutes: 9
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; all=[x for a in d.values() for x in a if x.get("isAvailable",True)]; pick=next((x for x in all if "iPad" in x["name"]), next((x for x in all if "iPhone" in x["name"]), None)); print(pick["udid"] if pick else "")')"
          if [ -z "$SIMULATOR_ID" ]; then echo "No iOS Simulator" >&2; exit 1; fi
          xcodebuild -scheme InfiniCanvasCore -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath /tmp/InfiniCoreTests26 CODE_SIGNING_ALLOWED=NO test

  modern-sdk-and-host:
    name: Xcode 27 actual Swift Playgrounds host integration
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm modern SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Compile core with Xcode 27
        run: |
          set -euo pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCore27 CODE_SIGNING_ALLOWED=NO build
      - name: Validate actual iPad app-host manifest against this PR's package
        run: |
          set -euo pipefail
          cd IntegrationHost/InfiniCanvasPermanent.swiftpm
          swift package dump-package > /tmp/infini-host-manifest.json
          xcodebuild -list -json | tee /tmp/infini-host-schemes.json
          xcodebuild -scheme 'Infini Canvas' -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniHost27 CODE_SIGNING_ALLOWED=NO build
