name: Validate Infini Canvas on Apple SDK

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'IntegrationHost/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
      - 'Scripts/preflight_contract.py'
  pull_request:
    branches: [main]
    paths:
      - 'Scripts/preflight_contract.py'
      - 'Sources/**'
      - 'Tests/**'
      - 'IntegrationHost/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-v2-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Cheap source and app identity checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify host identity and local-package wiring before Mac builds
        run: python3 Scripts/preflight_contract.py

  current-playgrounds-sdk:
    needs: preflight
    # Swift Playground 4.7's published SDK is iOS 26. Test the compiler family
    # user's actual iPad editor can use, not only future Xcode 27 SDKs.
    name: Existing iPad Playground SDK and PencilKit tests
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: SDK versions
        run: xcodebuild -version
      - name: Geometric zoom/lasso invariants
        run: |
          set -euo pipefail
          swiftc Sources/InfiniCanvasCore/CanvasGeometry.swift Tests/GeometrySmoke/GeometrySmoke.swift -o /tmp/geometry-smoke
          /tmp/geometry-smoke
      - name: Compile package against iPad Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCore26 CODE_SIGNING_ALLOWED=NO build
      - name: Test actual SwiftUI root, PencilKit and persistence
        timeout-minutes: 9
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; all=[x for a in d.values() for x in a if x.get("isAvailable",True)]; pick=next((x for x in all if "iPad" in x["name"]), next((x for x in all if "iPhone" in x["name"]), None)); print(pick["udid"] if pick else "")')"
          if [ -z "$SIMULATOR_ID" ]; then echo "No iOS Simulator" >&2; exit 1; fi
          xcodebuild -scheme InfiniCanvasCore -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath /tmp/InfiniCoreTests26 CODE_SIGNING_ALLOWED=NO test

  modern-sdk-and-host:
    needs: preflight
    name: Xcode 27 actual Swift Playgrounds host integration
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm modern SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Compile core with Xcode 27
        run: |
          set -euo pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCore27 CODE_SIGNING_ALLOWED=NO build
      - name: Validate Playgrounds host identity and native app manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('IntegrationHost/InfiniCanvasPermanent.swiftpm/Package.swift').read_text()
          a=Path('IntegrationHost/InfiniCanvasPermanent.swiftpm/Sources/InfiniCanvasApp.swift').read_text()
          project=Path('IntegrationHost/project.yml').read_text()
          for required in ['import AppleProductTypes', 'com.perspective2001.infini-canvas.native',
                           'microphone(', 'InfiniCanvasCore', '17.5']:
              assert required in p, f'Missing expected host manifest field: {required}'
          for required in ['import InfiniCanvasCore', '@main', 'InfiniCanvasRootView()']:
              assert required in a, f'Missing app entry-point symbol: {required}'
          assert 'InfiniCanvasPermanent.swiftpm/Sources/InfiniCanvasApp.swift' in project
          assert 'com.perspective2001.infini-canvas.native' in project
          print('PASS: native host entry point, bundle ID, minimum iOS and permissions')
          PY
      - name: Build real native iPad application entrypoint with the package
        timeout-minutes: 7
        run: |
          set -euo pipefail
          brew install xcodegen
          cd IntegrationHost
          xcodegen generate
          xcodebuild -project InfiniCanvasHost.xcodeproj -scheme InfiniCanvasHost -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniHost27 CODE_SIGNING_ALLOWED=NO build
      # The full iPad application is already compiled above. Booting that
      # EXACT app in Simulator and capturing the compositor output is a
      # low-additional-cost visual check, not a second speculative app build.
      - name: Capture actual iPad Simulator rendered app screenshot
        if: success()
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/InfiniVisualEvidence"
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for v in d.values() for x in v if x.get("isAvailable", True)]; p=next((x for x in a if "iPad" in x["name"]), None); print(p["udid"] if p else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::error::No available iPad simulator; actual rendered UI could not be inspected."
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl status_bar "$SIMULATOR_ID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP="/tmp/InfiniHost27/Build/Products/Debug-iphonesimulator/InfiniCanvasHost.app"
          test -d "$APP" || { echo "::error::Missing actual native app $APP"; exit 1; }
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch "$SIMULATOR_ID" com.perspective2001.infini-canvas.native
          sleep 4
          xcrun simctl io "$SIMULATOR_ID" screenshot --type=png "$RUNNER_TEMP/InfiniVisualEvidence/native-ipad-root.png"
          test -s "$RUNNER_TEMP/InfiniVisualEvidence/native-ipad-root.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/InfiniVisualEvidence/native-ipad-root.png"
          {
            echo "Source SHA: $(git rev-parse HEAD)"
            echo "Actual compiled application: $APP"
            echo "Simulator: $SIMULATOR_ID"
            echo "Capture: native iPad compositor screenshot"
            echo "Visual review: UNREVIEWED; screenshot generation is NOT design approval"
            echo "User-approved baseline: not claimed"
          } > "$RUNNER_TEMP/InfiniVisualEvidence/visual-review-info.txt"
      - name: Upload real native iPad rendered screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: InfiniCanvas-Native-Visual-${{ github.sha }}
          path: ${{ runner.temp }}/InfiniVisualEvidence/
          retention-days: 14
          if-no-files-found: warn

