name: Validate Infini Canvas on Apple SDK

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'IntegrationHost/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
      - 'Scripts/preflight_contract.py'
  pull_request:
    branches: [main]
    paths:
      - 'Scripts/preflight_contract.py'
      - 'Sources/**'
      - 'Tests/**'
      - 'IntegrationHost/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-v2-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Cheap source and app identity checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify host identity and local-package wiring before Mac builds
        run: python3 Scripts/preflight_contract.py

  current-playgrounds-sdk:
    needs: preflight
    # Swift Playground 4.7's published SDK is iOS 26. Test the compiler family
    # user's actual iPad editor can use, not only future Xcode 27 SDKs.
    name: Existing iPad Playground SDK and PencilKit tests
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: SDK versions
        run: xcodebuild -version
      - name: Geometric zoom/lasso invariants
        run: |
          set -euo pipefail
          swiftc Sources/InfiniCanvasCore/CanvasGeometry.swift Tests/GeometrySmoke/GeometrySmoke.swift -o /tmp/geometry-smoke
          /tmp/geometry-smoke
      - name: Compile package against iPad Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCore26 CODE_SIGNING_ALLOWED=NO build
      - name: Test actual SwiftUI root, PencilKit and persistence
        timeout-minutes: 9
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; all=[x for a in d.values() for x in a if x.get("isAvailable",True)]; pick=next((x for x in all if "iPad" in x["name"]), next((x for x in all if "iPhone" in x["name"]), None)); print(pick["udid"] if pick else "")')"
          if [ -z "$SIMULATOR_ID" ]; then echo "No iOS Simulator" >&2; exit 1; fi
          xcodebuild -scheme InfiniCanvasCore -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath /tmp/InfiniCoreTests26 CODE_SIGNING_ALLOWED=NO test
      # The iOS 26 runner above already demonstrated a functioning iPad
      # simulator by running actual PencilKit tests. Use THAT simulator for
      # compositor screenshots; the custom Xcode27 host runner stalled on boot.
      - name: Build actual native host and capture real iPad screen (same tested SDK)
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/InfiniVisualEvidence"
          brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd IntegrationHost && xcodegen generate)
          xcodebuild -project IntegrationHost/InfiniCanvasHost.xcodeproj \
            -scheme InfiniCanvasHost -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/InfiniHost26 CODE_SIGNING_ALLOWED=NO build
          APP="/tmp/InfiniHost26/Build/Products/Debug-iphonesimulator/InfiniCanvasHost.app"
          test -d "$APP" || { echo "::error::Host .app missing: $APP"; exit 1; }
          export APP
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'InfiniVisualEvidence'
          result = subprocess.run(['xcrun','simctl','list','devices','available','-j'],
                                  capture_output=True,text=True,timeout=35,check=True)
          devices=json.loads(result.stdout)['devices']
          options=[d for group in devices.values() for d in group
                   if 'iPad' in d['name'] and d.get('isAvailable',True)]
          if not options: raise RuntimeError('No iPad Simulator on tested iOS26 runner')
          sim=next((d for d in options if d['state']=='Booted'),options[0])
          sid=sim['udid']
          def cmd(*args,seconds=55):
              print('VISUAL-CAPTURE:',*args,flush=True)
              return subprocess.run(args,timeout=seconds,check=True)
          if sim['state']!='Booted': cmd('xcrun','simctl','boot',sid,seconds=50)
          cmd('xcrun','simctl','bootstatus',sid,'-b',seconds=55)
          cmd('xcrun','simctl','install',sid,os.environ['APP'],seconds=45)
          cmd('xcrun','simctl','launch',sid,'com.perspective2001.infini-canvas.native',seconds=35)
          time.sleep(5)
          shot=dest/'native-ipad-root.png'
          cmd('xcrun','simctl','io',sid,'screenshot','--type=png',str(shot),seconds=30)
          if shot.stat().st_size<20000: raise RuntimeError('Native screenshot blank or missing')
          (dest/'visual-review-info.txt').write_text(
              'Source SHA: '+os.environ['GITHUB_SHA']+'\\n'
              'Actual host: '+os.environ['APP']+'\\n'
              'Simulator: '+sim['name']+' ['+sid+']\\n'
              'Capture: native iOS26 iPad Simulator rendered pixels\\n'
              'Visual acceptance: UNREVIEWED - requires human/model opening this image\\n'
              'Motion: NOT CAPTURED; this screenshot proves only resting UI\\n')
          print('REAL NATIVE IPAD SCREENSHOT:',shot,'bytes:',shot.stat().st_size,flush=True)
          PY
      - name: Upload native iPad screenshot for visual inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: InfiniCanvas-Native-Visual-${{ github.sha }}
          path: ${{ runner.temp }}/InfiniVisualEvidence/
          retention-days: 14
          if-no-files-found: warn


  modern-sdk-and-host:
    needs: preflight
    name: Xcode 27 actual Swift Playgrounds host integration
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm modern SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Compile core with Xcode 27
        run: |
          set -euo pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCore27 CODE_SIGNING_ALLOWED=NO build
      - name: Validate Playgrounds host identity and native app manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('IntegrationHost/InfiniCanvasPermanent.swiftpm/Package.swift').read_text()
          a=Path('IntegrationHost/InfiniCanvasPermanent.swiftpm/Sources/InfiniCanvasApp.swift').read_text()
          project=Path('IntegrationHost/project.yml').read_text()
          for required in ['import AppleProductTypes', 'com.perspective2001.infini-canvas.native',
                           'microphone(', 'InfiniCanvasCore', '17.5']:
              assert required in p, f'Missing expected host manifest field: {required}'
          for required in ['import InfiniCanvasCore', '@main', 'InfiniCanvasRootView()']:
              assert required in a, f'Missing app entry-point symbol: {required}'
          assert 'InfiniCanvasPermanent.swiftpm/Sources/InfiniCanvasApp.swift' in project
          assert 'com.perspective2001.infini-canvas.native' in project
          print('PASS: native host entry point, bundle ID, minimum iOS and permissions')
          PY
      - name: Build real native iPad application entrypoint with the package
        timeout-minutes: 7
        run: |
          set -euo pipefail
          brew install xcodegen
          cd IntegrationHost
          xcodegen generate
          xcodebuild -project InfiniCanvasHost.xcodeproj -scheme InfiniCanvasHost -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniHost27 CODE_SIGNING_ALLOWED=NO build
