name: Validate Infini Canvas on Apple SDK

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/validate-apple-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm Xcode and available schemes
        run: |
          xcodebuild -version
          xcodebuild -list
      - name: Resolve public version as a fresh dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/infini-consumer/Sources/InfiniConsumer
          cat > /tmp/infini-consumer/Package.swift <<'EOF'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "InfiniConsumer",
              platforms: [.iOS("17.5")],
              dependencies: [
                  .package(url: "https://github.com/perspective2001/InfiniCanvasCore.git", from: "1.0.0")
              ],
              targets: [
                  .executableTarget(name: "InfiniConsumer", dependencies: ["InfiniCanvasCore"])
              ]
          )
          EOF
          echo 'import InfiniCanvasCore' > /tmp/infini-consumer/Sources/InfiniConsumer/main.swift
          cd /tmp/infini-consumer
          swift package resolve
          swift package show-dependencies
      - name: Compile for iPad simulator
        run: |
          set -o pipefail
          xcodebuild -scheme InfiniCanvasCore -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/InfiniCanvasBuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/infini-build.log
