name: Publish Swift package version tag
on:
  push:
    branches: [main]
    paths:
      - SWIFT_PACKAGE_VERSION
      - .github/workflows/publish-swift-package.yml
permissions:
  contents: write
jobs:
  tag-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate and publish version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < SWIFT_PACKAGE_VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Package tag $VERSION already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
